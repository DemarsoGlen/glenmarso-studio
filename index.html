<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glen Marso — Студия литературно-философского и художественного творчества</title>
  <meta name="description" content="Студия литературно-философского и художественного творчества Глена Марсо">
  <meta name="theme-color" content="#000000">
  <meta property="og:title" content="Glen Marso Studio">
  <meta property="og:description" content="Что бы ни посетило воображение — всё действительно, ибо воображение — сама действительность…">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://studio.glenmarso.com">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page">
    <div class="hero-wrapper">
      <img src="hero.jpg" alt="Glen Marso — Студия литературно-философского и художественного творчества" class="hero-image" draggable="false">

      <!-- Верхняя композиция → Манифест -->
      <button type="button" class="hotspot hotspot-logo" id="manifestoBtn" title="Манифест" aria-label="Открыть Манифест"></button>

      <!-- Разделы -->
      <a href="/proza/" class="hotspot hotspot-proza" title="Проза" aria-label="Проза"></a>
      <a href="/art/" class="hotspot hotspot-art" title="Арт" aria-label="Арт"></a>
      <a href="/kub/" class="hotspot hotspot-kub" title="КУБ" aria-label="КУБ"></a>
      <a href="/poeziya/" class="hotspot hotspot-poeziya" title="Поэзия" aria-label="Поэзия"></a>
      
      <!-- Правый арт-объект = Контакты -->
      <button type="button" class="hotspot hotspot-contacts" id="contactsBtn" title="Контакты" aria-label="Контакты"></button>
    </div>

    <!-- Панель Манифеста -->
    <div class="manifesto-panel" id="manifestoPanel" hidden>
      <div class="manifesto-inner">
        <button type="button" class="manifesto-close" id="manifestoClose" aria-label="Закрыть">×</button>
        
        <div class="manifesto-content" id="manifestoContent"></div>
        
        <div class="lang-switcher" id="langSwitcher">
          <button type="button" class="lang-btn active" data-lang="ru">RU</button>
          <span class="lang-sep">·</span>
          <button type="button" class="lang-btn" data-lang="en">EN</button>
          <span class="lang-sep">·</span>
          <button type="button" class="lang-btn" data-lang="de">DE</button>
          <span class="lang-sep">·</span>
          <button type="button" class="lang-btn" data-lang="fr">FR</button>
          <span class="lang-sep">·</span>
          <button type="button" class="lang-btn" data-lang="it">IT</button>
          <span class="lang-sep">·</span>
          <button type="button" class="lang-btn" data-lang="es">ES</button>
        </div>
      </div>
    </div>

    <!-- Панель контактов -->
    <div class="contacts-panel" id="contactsPanel" hidden>
      <div class="contacts-inner">
        <button type="button" class="contacts-close" id="contactsClose" aria-label="Закрыть">×</button>
        <h3>Контакты</h3>
        <ul>
          <li><a href="mailto:glen.marso@studio.ru">glen.marso@studio.ru</a></li>
          <li><a href="https://t.me/glenmarso" target="_blank" rel="noopener">t.me/glenmarso</a></li>
          <li><a href="https://vk.com/glenmarso" target="_blank" rel="noopener">vk.com/glenmarso</a></li>
          <li>Санкт-Петербург</li>
        </ul>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
  <script src="protect.js"></script>
</body>
</html>
