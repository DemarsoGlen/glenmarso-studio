<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Поэзия — Glen Marso Studio</title>
  <meta name="description" content="Поэзия Глена Марсо: стихи, поэмы, сборники">
  <meta name="theme-color" content="#000000">
  <link rel="stylesheet" href="../styles-section.css">
</head>
<body>
  <div class="section-page">
    <header class="section-header">
      <a href="/" class="back-link" title="На главную">←</a>
      <h1 class="section-title">Поэзия</h1>
      <div class="header-spacer"></div>
    </header>

    <div class="section-intro">
      <p>Стихи, поэмы, сборники. Сжатая форма того, что нельзя сказать прозой.</p>
    </div>

    <nav class="categories" aria-label="Категории">
      <button class="cat-btn active" data-filter="all">Все</button>
      <button class="cat-btn" data-filter="stihi">Стихи</button>
      <button class="cat-btn" data-filter="poemy">Поэмы</button>
      <button class="cat-btn" data-filter="sborniki">Сборники</button>
    </nav>

    <div class="works-grid" id="worksGrid">
      <a href="#" class="work-card" data-category="stihi">
        <div class="work-cover"><span class="cover-placeholder">Обложка</span></div>
        <div class="work-info">
          <h2 class="work-title">Название цикла</h2>
          <span class="work-meta">Стихи · 2025</span>
        </div>
      </a>
      <a href="#" class="work-card" data-category="poemy">
        <div class="work-cover"><span class="cover-placeholder">Обложка</span></div>
        <div class="work-info">
          <h2 class="work-title">Название поэмы</h2>
          <span class="work-meta">Поэма · 2024</span>
        </div>
      </a>
      <a href="#" class="work-card" data-category="sborniki">
        <div class="work-cover"><span class="cover-placeholder">Обложка</span></div>
        <div class="work-info">
          <h2 class="work-title">Название сборника</h2>
          <span class="work-meta">Сборник · 2023</span>
        </div>
      </a>
      <a href="#" class="work-card" data-category="stihi">
        <div class="work-cover"><span class="cover-placeholder">Обложка</span></div>
        <div class="work-info">
          <h2 class="work-title">Ещё стихи</h2>
          <span class="work-meta">Стихи · 2026</span>
        </div>
      </a>
    </div>

    <footer class="section-footer">
      <p>© Glen Marso Studio</p>
    </footer>
  </div>
  <script src="../script-section.js"></script>
</body>
</html>
