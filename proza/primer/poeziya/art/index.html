<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Арт — Glen Marso Studio</title>
  <meta name="description" content="Арт: графика, аудио, видео">
  <meta name="theme-color" content="#000000">
  <link rel="stylesheet" href="../styles-section.css">
</head>
<body>
  <div class="section-page">
    <header class="section-header">
      <a href="/" class="back-link" title="На главную">←</a>
      <h1 class="section-title">Арт</h1>
      <div class="header-spacer"></div>
    </header>

    <div class="section-intro">
      <p>Графика, аудио, видео. Всё, что не является текстом, но несёт образ.</p>
    </div>

    <nav class="categories" aria-label="Категории">
      <button class="cat-btn active" data-filter="all">Все</button>
      <button class="cat-btn" data-filter="grafika">Графика</button>
      <button class="cat-btn" data-filter="audio">Аудио</button>
      <button class="cat-btn" data-filter="video">Видео</button>
    </nav>

    <div class="works-grid" id="worksGrid">
      <a href="#" class="work-card" data-category="grafika">
        <div class="work-cover"><span class="cover-placeholder">Обложка</span></div>
        <div class="work-info">
          <h2 class="work-title">Название работы</h2>
          <span class="work-meta">Графика · 2025</span>
        </div>
      </a>
      <a href="#" class="work-card" data-category="audio">
        <div class="work-cover"><span class="cover-placeholder">Обложка</span></div>
        <div class="work-info">
          <h2 class="work-title">Аудиоработа</h2>
          <span class="work-meta">Аудио · 2024</span>
        </div>
      </a>
      <a href="#" class="work-card" data-category="video">
        <div class="work-cover"><span class="cover-placeholder">Обложка</span></div>
        <div class="work-info">
          <h2 class="work-title">Видеоработа</h2>
          <span class="work-meta">Видео · 2025</span>
        </div>
      </a>
      <a href="#" class="work-card" data-category="grafika">
        <div class="work-cover"><span class="cover-placeholder">Обложка</span></div>
        <div class="work-info">
          <h2 class="work-title">Ещё графика</h2>
          <span class="work-meta">Графика · 2026</span>
        </div>
      </a>
    </div>

    <footer class="section-footer">
      <p>© Glen Marso Studio</p>
    </footer>
  </div>
  <script src="../script-section.js"></script>
</body>
</html>
